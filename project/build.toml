# Production migration registry (Cuts A–BI). Each entry maps one independent
# `USE_RUST_*` gate to its blob, embed include, and gate assignment file.
# `enabled` is applied to `gate_file` before every kernel assemble (independent
# per-cut). Production defaults are all `true`. Set `enabled = false` for a
# legacy or mixed kernel without hand-editing FASM. Doctor verifies live values.
# Newest-first; must stay 1:1 with generic `[[rust.blobs]]` (probe excluded).
[[rust.migrations]]
cut = "BI"
blob = "rust_iso9660_copy_name.bin"
symbol = "rust_iso9660_copy_name"
gate = "USE_RUST_ISO9660_COPY_NAME"
include = "kernel/rust/iso9660_copy_name.inc"
gate_file = "kernel/fs/iso9660.inc"
enabled = true

