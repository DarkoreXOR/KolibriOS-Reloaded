[package]
name = "orch"
version = "0.1.0"
edition = "2021"
description = "KolibriOS project operations orchestrator: build, images, QEMU, Rhai workflows"
license = "GPL-2.0-or-later"
publish = false

[[bin]]
name = "orch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rhai = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
