[package]
name = "binutil"
version = "0.1.0"
edition = "2021"
description = "Host asm/disasm + object/binary inspect for Kolibri kernel work"
license = "GPL-2.0-or-later"
publish = false

[[bin]]
name = "binutil"
path = "src/main.rs"

[features]
default = ["iced", "object-parse"]
# Pure-Rust disassembler (always preferred default).
iced = ["dep:iced-x86"]
# Capstone C library (needs a C toolchain via the `cc` crate).
capstone = ["dep:capstone"]
# Keystone assembler (needs cmake + C++ toolchain; `build-from-src`).
keystone = ["dep:keystone-engine"]
# ELF/COFF/Mach-O/archive parsing.
object-parse = ["dep:object"]
# Convenience: everything that needs a native toolchain.
native = ["capstone", "keystone"]
full = ["iced", "capstone", "keystone", "object-parse"]

[dependencies]
iced-x86 = { version = "1.21", optional = true, default-features = false, features = ["std", "decoder", "intel", "nasm", "masm", "gas", "fast_fmt"] }
# Capstone C library (needs a C toolchain via the `cc` crate).
# 0.12 keeps a simple feature surface; bump when MSVC/cmake is available locally.
capstone = { version = "0.12", optional = true, default-features = false, features = ["std"] }
# Optional: builds Keystone 0.9.2 from source (requires cmake).
keystone-engine = { version = "0.1.0", optional = true, default-features = false, features = ["build-from-src"] }
object = { version = "0.36", optional = true, default-features = false, features = ["read", "std", "elf", "coff", "pe", "macho", "archive"] }
