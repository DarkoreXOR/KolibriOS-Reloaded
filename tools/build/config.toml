# kolibri_build — repository-local build / image / QEMU orchestrator
#
# Paths are relative to the repository root unless noted as absolute.
# This file is the source of truth for developer `run` / `build` / `image` / `qemu`.
# Do not put secrets here.

# ---------------------------------------------------------------------------
# Rust freestanding components (Cuts A–O Strategy A+C blobs)
# ---------------------------------------------------------------------------
[rust]
# Cargo workspace containing `kolibri_utils`.
workspace = "rust_kernel"
# Package to test and build as freestanding staticlib.
package = "kolibri_utils"
# Custom target JSON for `i686-kolibri-none`.
target_json = "rust_kernel/kolibri_utils/i686-kolibri-none.json"
# Isolates freestanding artifacts from tools/build's own target dir.
cargo_target_dir = "rust_kernel/target"
# Where reloc-free `*.bin` blobs are written (embedded by kernel/rust/*.inc).
out_dir = "rust_kernel/kolibri_utils/out"
# Nightly toolchain name passed to `cargo +<toolchain>`.
toolchain = "nightly"
# Run `cargo test -p kolibri_utils` before freestanding build (recommended).
run_host_tests = true
# Delete prior staticlib/deps before freestanding build (matches build-*.ps1).
# Prevents stale RUSTFLAGS / incremental leftovers from shipping bad blobs.
force_recompile_staticlib = true
# Clear process RUSTFLAGS for the freestanding build (must not lower opt-level).
clear_rustflags = true

# Extractor scripts (canonical project Python helpers — invoked by this tool).
[rust.extract]
# Prefer `python` on PATH; doctor also tries `python3` / `py -3` if needed at runtime.
python = "python"
generic_script = "rust_kernel/kolibri_utils/scripts/extract_reloc_free_text.py"
probe_script = "rust_kernel/kolibri_utils/scripts/extract_phase_c_probe.py"

# Blobs currently required by the hybrid kernel (Cuts A–O). Order is extraction
# order only; FASM embeds whichever files `kernel/rust/*.inc` reference.
[[rust.blobs]]
kind = "generic"
section = ".text.rust_test_app_header"
symbol = "rust_test_app_header"
expect_ret_imm = 12
out = "rust_test_app_header.bin"

[[rust.blobs]]
kind = "generic"
section = ".text.rust_anti_aliasing"
symbol = "rust_anti_aliasing"
expect_ret_imm = 8
out = "rust_anti_aliasing.bin"

[[rust.blobs]]
