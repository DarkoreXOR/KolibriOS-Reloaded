# ---------------------------------------------------------------------------
# FASM kernel assemble
# ---------------------------------------------------------------------------
[kernel]
# Vendored assembler (repo-relative). Preferred over system `fasm`.
fasm = "fasm/FASM.EXE"
# Entry assembly unit.
asm = "kernel/kernel.asm"
# Output artifact used for image replace / QEMU.
output = "kernel/bin/kernel.mnt"
# Ephemeral `kernel/lang.inc` content: `lang fix <lang>`.
lang = "en_US"
# FASM `-m` memory size (matches project docs).
memory_kib = 262144

# ---------------------------------------------------------------------------
# Disposable test image (never mutate the reference)
# ---------------------------------------------------------------------------
[image]
# Host helper crate (built on demand).
tool_manifest = "tools/kolibri_img/Cargo.toml"
# Expected release binary after `cargo build --release` (Windows name).
# On Unix the tool looks for `kolibri_img` beside this path / without `.exe`.
tool_bin = "tools/kolibri_img/target/release/kolibri_img.exe"
# Immutable reference floppy — read-only; only CoW copies are mutated.
base_image = "kolibrios-0.7.7.0-9160-g944d74f01-en_US.img"
# Directory for fresh test images (created if missing). Relative to repo root.
output_dir = "build/test"
# Filename pattern. `{timestamp}` → local YYYYMMDD-HHMMSS.
filename_pattern = "kernel-{timestamp}.img"
# Root FAT 8.3 names deleted on the CoW copy before replace (frees clusters).
delete_before_replace = ["DOCPACK"]
# Destination name inside the image for the newly built kernel.
kernel_fat_name = "KERNEL.MNT"

# ---------------------------------------------------------------------------
# QEMU
# ---------------------------------------------------------------------------
[qemu]
# Candidates tried in order; first existing file or PATH lookup wins.
# Platform-specific entries are fine here; unused paths are skipped.
executables = [
  "C:\\Program Files\\qemu\\qemu-system-i386.exe",
  "qemu-system-i386",
]
# Arguments always passed (image path is injected as `-fda <fresh-img>`).
args = ["-boot", "a", "-m", "256", "-vga", "std"]
# Extra args when `--headless` is set (automation / CI-style smoke).
# Include QMP so callers can query-status / screendump without a VGA window.
headless_extra_args = [
  "-display", "none",
  "-no-reboot",
  "-no-shutdown",
  "-qmp", "tcp:127.0.0.1:4550,server,nowait",
]
# Extra args for `ref`: boot `image.base_image` without rebuilding.
# `-snapshot` keeps disk writes in RAM so the reference floppy is never modified.
reference_extra_args = ["-snapshot"]

# ---------------------------------------------------------------------------
# Cleanup / diagnostics
# ---------------------------------------------------------------------------
[cleanup]
# If true, delete the temporary image after QEMU exits 0.
# Default false: keep artifacts for inspection after failures and success.
delete_image_on_success = false
