# Fallback when `.orch/config.toml` is absent (standalone / package-local runs).
# Prefer the repo-root `.orch/config.toml` in this monorepo.

actions_dirs = [".orch/actions"]
workflows_dirs = [".orch/workflows"]
tools_dirs = ["tools"]
lib_dirs = [".orch/lib"]
temp_dir = ".orch-tmp"
process_termination_timeout_ms = 5000
timer_poll_ms = 50
http_max_body_bytes = 16777216
