[package]
name = "orch"
version = "0.1.0"
edition = "2021"
description = "Universal Rust/Rhai automation orchestrator"
license = "GPL-2.0-or-later"
publish = false

[[bin]]
name = "orch"
path = "src/main.rs"

[lib]
name = "orch"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
ctrlc = "3"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
rand = "0.8"
getrandom = "0.2"
rhai = { version = "1.25", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
ureq = { version = "2", default-features = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
